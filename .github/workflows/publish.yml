name: Publish The Compute Chronicles

on:
  schedule:
    # Run each hour; the publisher itself enforces 08:00 America/Chicago, including DST.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish now, bypassing the 8 AM guard
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: compute-chronicles-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build today’s edition
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_PUBLISH: ${{ inputs.force || 'false' }}
        run: node scripts/publish.mjs
      - name: Commit edition and site
        run: |
          git config user.name "The Compute Chronicles Publisher"
          git config user.email "actions@github.com"
          git add index.html archive.html Archive assets data
          git diff --cached --quiet || git commit -m "Publish The Compute Chronicles $(date -u +%F)"
          git push
      - name: Send daily link
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: node scripts/send-gmail.mjs
